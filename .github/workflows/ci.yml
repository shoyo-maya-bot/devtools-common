name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: shoyo-maya-bot/devtools-workspace/.github/workflows/python-ci.yml@d3f4335f4e96328504b33ad5327320719c3afb7f  # devtools-workspace の共通 CI（SHA 固定）
    # 非公開の依存が無いので、シークレットは渡さない（secrets: inherit は全シークレットが渡るので使わない）
    # with: run-windows は既定で true（windows-latest でもテストを流す）
