name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: shoyo-maya-bot/devtools-workspace/.github/workflows/python-ci.yml@4f21d326c527d6de1e6d34527b77e912e217115a  # devtools-workspace の共通 CI（SHA 固定）
    # 非公開の依存が無いので、シークレットは渡さない（secrets: inherit は全シークレットが渡るので使わない）
    # with: run-windows は既定で true（windows-latest でもテストを流す）
